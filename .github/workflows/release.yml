name: Release
run-name: ${{ format('release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "10.30.3"

jobs:
  validate:
    if: github.repository == 'Ssoon-m/reviewflux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - name: Ensure tag version matches package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "${VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Run release validation
        run: pnpm test:all

  publish:
    if: github.repository == 'Ssoon-m/reviewflux'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate version
        id: release_meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}"
            exit 1
          fi

          DIST_TAG=""
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG=$(printf '%s' "${VERSION#*-}" | cut -d'.' -f1)
            DIST_TAG=${DIST_TAG:-next}
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure version is not already published
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "reviewflux@${VERSION}" version >/dev/null 2>&1; then
            echo "reviewflux@${VERSION} is already published on npm."
            exit 1
          fi

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
        run: |
          set -euo pipefail

          if [[ -n "${DIST_TAG}" ]]; then
            TAG_ARGS=(--tag "${DIST_TAG}")
          else
            TAG_ARGS=()
          fi

          npm publish --provenance --access public "${TAG_ARGS[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "${TAG_NAME}" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" --title "${TAG_NAME}" --generate-notes
