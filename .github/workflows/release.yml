name: Release
run-name: ${{ format('release {0}', inputs.version || inputs.bump) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump major, minor, or patch
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Override version (for example 0.1.1-beta.0). Takes precedence over bump.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22.14.0"
  PNPM_VERSION: "10.30.3"

jobs:
  validate:
    if: github.repository == 'Ssoon-m/reviewflux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure release runs from main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main."
            exit 1
          fi

      - name: Run release validation
        run: pnpm test:all

  publish:
    if: github.repository == 'Ssoon-m/reviewflux'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate version
        id: release_meta
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION}"

          if [[ -z "${VERSION}" ]]; then
            PREV=$(npm view reviewflux@latest version 2>/dev/null || true)
            if [[ -z "${PREV}" || "${PREV}" == "null" ]]; then
              PREV=$(node -p "require('./package.json').version")
            fi

            BASE="${PREV%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"

            case "${INPUT_BUMP}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}"
            exit 1
          fi

          DIST_TAG=""
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG=$(printf '%s' "${VERSION#*-}" | cut -d'.' -f1)
            DIST_TAG=${DIST_TAG:-next}
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure version is not already published
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "reviewflux@${VERSION}" version >/dev/null 2>&1; then
            echo "reviewflux@${VERSION} is already published on npm."
            exit 1
          fi

      - name: Update package version for release build
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node -e "const fs=require('node:fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\n');"

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
        run: |
          set -euo pipefail

          if [[ -n "${DIST_TAG}" ]]; then
            TAG_ARGS=(--tag "${DIST_TAG}")
          else
            TAG_ARGS=()
          fi

          npm publish --provenance "${TAG_ARGS[@]}"

      - name: Commit release version
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json

          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(release): publish v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" --title "v${VERSION}" --target HEAD --generate-notes
